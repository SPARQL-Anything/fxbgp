# The root logger with appender name
rootLogger = INFO, STDOUT

appenders = console, file

# Assign STDOUT a valid appender & define its layout
appender.console.name = STDOUT
appender.console.type = Console
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %msg%n  
#appender.console.filter.threshold.type = ThresholdFilter
#appender.console.filter.threshold.level = trace

appender.file.name = FILE
appender.file.type = File
appender.file.fileName=debug.log


#loggers = rolling, rolling2, rolling3, test
loggers = rolling, rolling2, rolling3
logger.rolling.name = io.github.sparqlanything.fxbgp.stream.FXTreeSolutionBuilder
logger.rolling.level = error
logger.rolling.additivity = false
#logger.rolling.appenderRef.file.ref = FILE
logger.rolling.appenderRef.console.ref = STDOUT

logger.rolling3.name = io.github.sparqlanything.fxbgp.stream.FXBroadcastEventListener
logger.rolling3.level = error
logger.rolling3.additivity = false
#logger.rolling.appenderRef.file.ref = FILE
logger.rolling3.appenderRef.console.ref = STDOUT

